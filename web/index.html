<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- CSS 가 닿기 전에 흰 화면이 번쩍이지 않도록 미리 알린다 -->
    <meta name="color-scheme" content="dark" />
    <!-- 주소창·상태 표시줄 색. styles.css 의 --bg 와 같아야 화면이 이어져 보인다 -->
    <meta name="theme-color" content="#12141a" />
    <title>변환기 — 문서·PDF·이미지·텍스트</title>

    <!-- 검색 결과와 공유 미리보기에 뜨는 한 줄. 이 도구가 남과 다른 곳은
         "브라우저 안에서 끝난다"는 것뿐이므로 그것을 먼저 적는다. -->
    <meta
      name="description"
      content="문서·PDF·이미지·표를 브라우저 안에서 바꾸는 변환기 25종. 어디로도 올리지 않는다 — 고른 파일은 이 컴퓨터를 벗어나지 않는다."
    />

    <!-- 공유했을 때의 미리보기.
         canonical 과 og:url 은 여기에 없다. 배포 주소를 알아야 쓸 수 있는데,
         틀린 주소를 박아 넣는 것이 빈 것보다 나쁘기 때문이다. VITE_SITE_URL 이
         있을 때만 vite 플러그인(vite.config.ts)이 넣어 준다.
         og:image 는 상대 경로로 두고, 같은 플러그인이 주소를 알 때 절대 주소로
         바꿔 준다 — 규약은 절대 주소를 요구하지만 없는 주소를 지어낼 수는 없다. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="변환기" />
    <meta property="og:title" content="변환기 — 문서·PDF·이미지·텍스트" />
    <meta
      property="og:description"
      content="문서·PDF·이미지·표를 브라우저 안에서 바꾼다. 고른 파일은 이 컴퓨터를 벗어나지 않는다."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="변환기 — 고른 파일은 이 컴퓨터를 벗어나지 않는다" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- SVG 가 본체다. 읽지 못하는 브라우저만 PNG 로 물러난다.
         자산은 web/scripts/gen-icons.mjs 가 굽는다. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <!-- 셸은 빈 칸만 갖는다. 칸을 채우는 것은 변환기다 (web/src/panel.ts). -->
    <div class="shell">
      <main id="converters-root" class="converters"></main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
